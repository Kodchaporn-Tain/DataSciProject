name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face CLI
        run: |
          python -m pip install --upgrade pip
          pip install -U "huggingface_hub[cli]"

      - name: Sync Traffic Prediction to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload tangmo00/traffic-prediction ./traffic-prediction . --repo-type space --token $HF_TOKEN

      - name: Sync Animal Image Classifier to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload tangmo00/Animal_image_classifier ./Animal_image_classifier . --repo-type space --token $HF_TOKEN