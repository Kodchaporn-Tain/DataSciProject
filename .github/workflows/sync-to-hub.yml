name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          
          python -m huggingface_hub.cli.hf upload tangmo00/traffic-prediction ./traffic-prediction . --repo-type space --token $HF_TOKEN
          
          python -m huggingface_hub.cli.hf upload tangmo00/Animal_image_classifier ./Animal_image_classifier/app . --repo-type space --token $HF_TOKEN